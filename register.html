<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DreamByte Share 2.0 - Registro</title>
  
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <div class="main-wrapper">
    
    <div class="login-container register-container frutiger-glass">
      
      <div class="logo-area">
        <h1>DreamByte <span>Share 2.0</span></h1>
        <p class="subtitle">Crear Nueva Identidad en la Nube</p>
      </div>
      
      <form class="login-form">
        
        <div class="form-grid">
          <div class="input-group">
            <label for="register-username">
              <span class="icon">👤</span> Nombre de Usuario
            </label>
            <input 
              type="text" 
              id="register-username" 
              placeholder="alex_byte" 
              required
            >
          </div>
          
          <div class="input-group">
            <label for="register-email">
              <span class="icon">📧</span> Correo Electrónico
            </label>
            <input 
              type="email" 
              id="register-email" 
              placeholder="tu_correo@dreambyte.com" 
              required
            >
          </div>
        </div>
        
        <div class="form-grid">
          <div class="input-group">
            <label for="register-pass">
              <span class="icon">🔒</span> Contraseña
            </label>
            <input 
              type="password" 
              id="register-pass" 
              placeholder="••••••••" 
              required
            >
          </div>
          
          <div class="input-group">
            <label for="confirm-pass">
              <span class="icon">🛡️</span> Confirmar Enlace
            </label>
            <input 
              type="password" 
              id="confirm-pass" 
              placeholder="••••••••" 
              required
            >
          </div>
        </div>

        <div class="password-strength-wrapper">
          <div class="strength-bar">
            <div class="strength-fill" style="width: 100%; background: linear-gradient(90deg, var(--purple-glow), var(--cyan-glow));"></div>
          </div>
          <span class="strength-text">Seguridad de Encriptación: <strong>Alta</strong></span>
        </div>
        
        <div class="form-actions registration-terms">
          <label class="remember-me">
            <input type="checkbox" id="terms" required> 
            <span>Acepto las directivas cuánticas de privacidad.</span>
          </label>
        </div>
        
        <button type="submit" class="btn-glossy">Inicializar Cuenta</button>
        
        <div class="form-footer-link">
          <p>¿Ya tienes una terminal asignada? <a href="login.html" class="forgot-link">Inicia sesión aquí</a></p>
        </div>
        
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.0/dist/umd/supabase.js"></script>

  <script src="js/config.js"></script>

  <script src="js/main.js"></script>

  <script src="js/register.js"></script>

</body>
</html>
