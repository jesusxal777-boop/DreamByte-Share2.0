<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>
  const form = document.querySelector('.login-form');
  
  form.addEventListener('submit', async (e) => {
    e.preventDefault(); // Evita que la página se recargue
    
    const email = document.getElementById('register-email').value;
    const password = document.getElementById('register-pass').value;
    const confirmPassword = document.getElementById('confirm-pass').value;
    const username = document.getElementById('register-username').value;

    if (password !== confirmPassword) {
      alert("⚠️ Las contraseñas no coinciden en la terminal.");
      return;
    }

    // Registrar en Supabase Auth
    const { data, error } = await supabase.auth.signUp({
      email: email,
      password: password,
      options: {
        // Guardamos el nombre de usuario dentro de los metadatos del usuario
        data: { username: username } 
      }
    });

    if (error) {
      alert(`❌ Error de enlace: ${error.message}`);
    } else {
      alert("🛰️ ¡Identidad cuántica creada con éxito! Redirigiendo...");
      window.location.href = 'login.html';
    }
  });
</script>
