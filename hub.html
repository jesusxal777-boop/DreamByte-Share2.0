<div class="dashboard-layout">
  <aside class="sidebar frutiger-glass">
    <div class="brand">DS 2.0</div>
    <nav class="menu">
      <a href="#" class="active"><i class="icon-folder"></i> Mis Archivos</a>
      <a href="#"><i class="icon-share"></i> Compartidos</a>
      <a href="#"><i class="icon-star"></i> Destacados</a>
    </nav>
    <div class="storage-counter">
      <span class="label">Almacenamiento Cuántico</span>
      <div class="progress-bar-container">
        <div class="progress-fill" style="width: 42%;"></div>
      </div>
      <span class="stats">12.6 GB / 30 GB</span>
    </div>
  </aside>

  <main class="main-content">
    <header class="dash-header frutiger-glass">
      <input type="search" placeholder="Escanear archivos..." class="search-input">
      <button class="btn-glossy upload-shortcut">+ Subir Archivo</button>
    </header>

    <section class="files-view frutiger-glass">
      <div class="view-header">
        <h2>Raíz / Documentos</h2>
        <div class="view-toggle">🧬 Lista | 🎛️ Cuadrícula</div>
      </div>
      
      <div class="files-grid">
        <div class="file-item folder">
          <div class="item-icon">📁</div>
          <span class="item-name">Proyectos_C++</span>
        </div>
        <div class="file-item file">
          <div class="item-icon">📄</div>
          <span class="item-name">patch_note.txt</span>
          <span class="item-size">4 KB</span>
        </div>
      </div>
    </section>
  </main>
</div>
