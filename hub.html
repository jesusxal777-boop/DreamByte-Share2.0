<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DreamByte Share 2.0 - Hub Especializado</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <div class="main-wrapper hub-wrapper">
    
    <!-- Panel Central -->
    <div class="hub-container frutiger-glass">
      
      <!-- Barra superior de usuario -->
      <div class="hub-header">
        <div class="brand">
          <h2>DreamByte <span>Share 2.0</span></h2>
          <span class="badge">Terminal Activa</span>
        </div>
        <button onclick="localStorage.clear(); sessionStorage.clear(); window.location.href='login.html';" class="btn-logout">Desconectar</button>
      </div>

      <hr class="divider">

      <!-- Zona de Carga (Upload) -->
      <div class="upload-section">
        <h3>🛰️ Inyectar Archivo a la Nube</h3>
        <p class="section-desc">Límite cuántico de <strong>100 MB</strong> por archivo. Los archivos sin descargas se purgan automáticamente en 7 días.</p>
        
        <form id="upload-form" class="upload-box">
          <input type="file" id="file-input" required>
          <button type="submit" class="btn-glossy">Subir al Almacenamiento</button>
        </form>
      </div>

      <!-- Zona de Archivos (Buscador y Descargas) -->
      <div class="storage-section">
        <h3>📁 Archivos en Orbita</h3>
        
        <!-- Lista Dinámica de Archivos -->
        <div id="files-list" class="files-grid">
          <!-- Los archivos cargados con JS aparecerán aquí de forma automática -->
        </div>
      </div>

    </div>
  </div>

  <!-- ============================================================ -->
  <!-- SCRIPTS DE INFRAESTRUCTURA                                  -->
  <!-- ============================================================ -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.0/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/hub.js"></script> <!-- Lógica de subidas y descargas -->

</body>
</html>
