<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DreamByte Share 2.0 - Login</title>
  
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <div class="login-container frutiger-glass">
    
    <div class="logo-area">
      <h1>DreamByte <span>Share 2.0</span></h1>
      <p class="subtitle">Cloud Nebula Storage</p>
    </div>
    
    <form class="login-form">
      <div class="input-group">
        <label>Usuario o Email</label>
        <input type="email" id="email" placeholder="usuario@dreambyte.com" required>
      </div>
      
      <div class="input-group">
        <label>Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      
      <button type="submit" class="btn-glossy">Iniciar Enlace</button>
    </form>

  </div>
