<div class="login-container frutiger-glass">
  <div class="logo-area">
    <h1>DreamByte <span>Share 2.0</span></h1>
    <p class="subtitle">Cloud Nebula Storage</p>
  </div>
  
  <form class="login-form">
    <div class="input-group">
      <label><i class="icon-user"></i> Usuario o Email</label>
      <input type="email" placeholder="usuario@dreambyte.com" required>
    </div>
    <div class="input-group">
      <label><i class="icon-lock"></i> Contraseña</label>
      <input type="password" placeholder="••••••••" required>
    </div>
    
    <div class="form-actions">
      <label class="remember-me">
        <input type="checkbox"> <span>Recordar sesión</span>
      </label>
      <a href="#" class="forgot-link">¿Olvidaste el acceso?</a>
    </div>
    
    <button type="submit" class="btn-glossy">Iniciar Enlace</button>
  </form>
</div>
